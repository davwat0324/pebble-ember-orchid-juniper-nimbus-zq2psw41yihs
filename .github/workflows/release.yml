name: Release

# Pushing a tag like v1.2.0 (release.ps1 does it) builds Remind-win64.zip and publishes a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check the tag matches src/version.py
        shell: pwsh
        run: |
          $v = [regex]::Match((Get-Content src/version.py -Raw), '__version__ = "([^"]+)"').Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version.py ($v)" }

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag message written by release.ps1 becomes the release notes (shown in Remind's update prompt).
          gh release create "${{ github.ref_name }}" dist/Remind-win64.zip --title "Remind ${{ github.ref_name }}" --notes-from-tag
